name: FogOfWorld
options:
  bundleIdPrefix: com.twogate
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

targets:
  FogOfWorld:
    type: application
    platform: iOS
    sources:
      - FogOfWorld
    dependencies:
      - target: FogOfWorldWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twogate.fogworld
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: "245VA3YW54"
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_ENTITLEMENTS: FogOfWorld/FogOfWorld.entitlements
    info:
      path: FogOfWorld/Info.plist
      properties:
        CFBundleName: fogworld
        CFBundleDisplayName: fogworld
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "訪れた場所の霧を晴らすために位置情報を使用します"
        NSLocationAlwaysAndWhenInUseUsageDescription: "バックグラウンドでも位置情報を記録し、訪れた場所の霧を晴らします"
        UIBackgroundModes:
          - location

  FogOfWorldWidget:
    type: app-extension
    platform: iOS
    sources:
      - FogOfWorldWidget
      - FogOfWorld/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twogate.fogworld.Widget
        PRODUCT_NAME: FogOfWorldWidget
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: "245VA3YW54"
        CODE_SIGN_STYLE: Automatic
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_ENTITLEMENTS: FogOfWorldWidget/FogOfWorldWidget.entitlements
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: FogOfWorldWidget/Info.plist
      properties:
        CFBundleName: FogOfWorldWidget
        CFBundleDisplayName: Fog of World
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
